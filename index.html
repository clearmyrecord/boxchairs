<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Chairs | Sit Outside the Box</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --red: #ef4338;
      --orange: #ff9518;
      --blue: #2d93d1;
      --dark: #20262b;
      --slate: #3f4850;
      --gray: #6f777d;
      --light: #f6f8fa;
      --white: #ffffff;
      --shadow: 0 20px 50px rgba(0, 0, 0, .12);
      --radius: 28px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--white);
      color: var(--slate);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: min(1120px, 92%);
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #e8edf2;
    }

    .nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
    }

    .site-logo {
      height: 52px;
      width: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 26px;
      align-items: center;
      font-weight: 700;
      font-size: .92rem;
      color: var(--gray);
    }

    .nav-links a:hover {
      color: var(--red);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 900;
      border: 0;
      cursor: pointer;
      transition: .2s ease;
    }

    .btn-primary {
      background: var(--red);
      color: white;
      box-shadow: 0 14px 30px rgba(239, 67, 56, .28);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
    }

    .btn-outline {
      border: 2px solid var(--slate);
      color: var(--slate);
      background: transparent;
    }

    .hero {
      padding: 86px 0 72px;
      overflow: hidden;
      background:
        radial-gradient(circle at top right, rgba(45,147,209,.14), transparent 34%),
        linear-gradient(180deg, #ffffff 0%, #f7fafc 100%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 54px;
      align-items: center;
    }

    .eyebrow {
      color: var(--blue);
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-size: .82rem;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(3.1rem, 7vw, 6.8rem);
      line-height: .9;
      letter-spacing: -.08em;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .hero p {
      font-size: 1.2rem;
      color: var(--gray);
      max-width: 620px;
      margin-bottom: 30px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .proof-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 620px;
    }

    .proof {
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .proof strong {
      display: block;
      color: var(--slate);
      font-size: 1.4rem;
      line-height: 1;
    }

    .proof span {
      color: var(--gray);
      font-size: .9rem;
      font-weight: 700;
    }

    .chair-card {
      position: relative;
      min-height: 520px;
      border-radius: var(--radius);
      background: linear-gradient(145deg, #ff9f1c, #ef4338);
      box-shadow: var(--shadow);
      overflow: hidden;
      padding: 36px;
      color: white;
    }

    .chair-shape {
      position: absolute;
      right: -25px;
      bottom: -35px;
      width: 78%;
      height: 78%;
      background: rgba(255,255,255,.16);
      clip-path: polygon(20% 0, 100% 18%, 90% 100%, 0 86%);
    }

    .chair-card h2 {
      position: relative;
      z-index: 2;
      font-size: 4.2rem;
      line-height: .9;
      letter-spacing: -.06em;
      text-transform: uppercase;
      max-width: 420px;
    }

    .chair-card .tag {
      position: relative;
      z-index: 2;
      margin-top: 20px;
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.22);
      font-weight: 900;
    }

    section {
      padding: 76px 0;
    }

    .section-title {
      max-width: 760px;
      margin-bottom: 38px;
    }

    .section-title.center {
      text-align: center;
      margin-left: auto;
      margin-right: auto;
    }

    .section-title h2 {
      font-size: clamp(2.2rem, 4vw, 4rem);
      line-height: 1;
      letter-spacing: -.06em;
      color: var(--slate);
      margin-bottom: 14px;
    }

    .section-title p {
      color: var(--gray);
      font-size: 1.1rem;
    }

    .video-section {
      background: var(--dark);
      color: white;
      padding: 46px 0 42px;
    }

    .video-section .section-title {
      margin-bottom: 24px;
    }

    .video-section .section-title h2,
    .video-section .section-title p {
      color: white;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #000;
    }

    .video-wrap iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }

    .photo-slider-section {
      background: #ffffff;
      padding: 36px 0 64px;
    }

    .photo-slider-section .section-title {
      margin-bottom: 18px;
    }

    .photo-slider-section .eyebrow {
      margin-bottom: 0;
    }

    .photo-slider {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background: var(--dark);
    }

    .slider-track {
      display: flex;
      transition: transform .45s ease;
    }

    .slide {
      min-width: 100%;
      height: 540px;
      background: var(--dark);
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      width: 50px;
      height: 50px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      color: var(--slate);
      font-size: 2.1rem;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,.18);
    }

    .slider-btn.prev {
      left: 18px;
    }

    .slider-btn.next {
      right: 18px;
    }

    .slider-dots {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin-top: 18px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 0;
      background: #cfd8e3;
      cursor: pointer;
    }

    .dot.active {
      background: var(--red);
      width: 28px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid #e7edf3;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 14px 35px rgba(0,0,0,.06);
    }

    .icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: rgba(45,147,209,.14);
      color: var(--blue);
      display: grid;
      place-items: center;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--blue);
      text-transform: uppercase;
    }

    .card p {
      color: var(--gray);
      font-size: .96rem;
    }

    .dark-band {
      background: var(--dark);
      color: white;
    }

    .dark-band .section-title h2,
    .dark-band .section-title p {
      color: white;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .step {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      padding: 28px;
    }

    .step-number {
      color: var(--orange);
      font-size: 2.4rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .pricing-note {
      background: #fff7ec;
      border: 1px solid #ffe0b6;
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow);
      max-width: 920px;
    }

    .pricing-note h3 {
      color: var(--red);
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .pricing-note p {
      color: var(--gray);
      margin-bottom: 18px;
      font-size: 1.05rem;
    }

    .pricing-note .hero-actions {
      margin-bottom: 0;
    }

    .cta {
      background:
        linear-gradient(135deg, rgba(239,67,56,.94), rgba(255,149,24,.94)),
        #ef4338;
      color: white;
      text-align: center;
      padding: 86px 0;
    }

    .cta h2 {
      font-size: clamp(2.5rem, 5vw, 5rem);
      line-height: .95;
      letter-spacing: -.07em;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .cta p {
      max-width: 720px;
      margin: 0 auto 28px;
      font-size: 1.15rem;
    }

    .cta .btn {
      background: white;
      color: var(--red);
    }

    footer {
      padding: 34px 0;
      background: var(--dark);
      color: #cbd3da;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      font-size: .92rem;
    }

    @media (max-width: 900px) {
      .nav {
        height: 72px;
      }

      .nav-links {
        display: none;
      }

      .site-logo {
        height: 44px;
      }

      .hero {
        padding: 56px 0 50px;
      }

      .hero-grid {
        grid-template-columns: 1fr;
      }

      .cards,
      .steps,
      .proof-row {
        grid-template-columns: 1fr;
      }

      .chair-card {
        min-height: 390px;
      }

      .chair-card h2 {
        font-size: 3.2rem;
      }

      section {
        padding: 56px 0;
      }

      .video-section {
        padding: 34px 0 28px;
      }

      .video-section .section-title {
        margin-bottom: 18px;
      }

      .photo-slider-section {
        padding: 26px 0 46px;
      }

      .photo-slider-section .section-title {
        margin-bottom: 14px;
      }

      .slide {
        height: 330px;
      }

      .slider-btn {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container nav">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="Box Chairs Logo" class="site-logo" />
    </a>

    <nav class="nav-links">
      <a href="#about">About</a>
      <a href="#video">Video</a>
      <a href="#photos">Photos</a>
      <a href="#services">Services</a>
      <a href="#pricing">Request Pricing</a>
      <a href="#contact" class="btn btn-primary">Start an Order</a>
